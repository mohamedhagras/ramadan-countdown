<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>باقي على رمضان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@300;400;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3ECDF; --bg2:#FAF6EC; --ink:#38483A; --muted:#7C8671; --accent:#5F7B5C; --line:#D9CFBB; --panel:#EAE1CE;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#222A22;--bg2:#2B352B;--ink:#EDE6D6;--muted:#A6AE98;--accent:#A8C3A0;--line:#3E4A3D;--panel:#2F3A2F}
}
:root[data-theme="dark"]{--bg:#222A22;--bg2:#2B352B;--ink:#EDE6D6;--muted:#A6AE98;--accent:#A8C3A0;--line:#3E4A3D;--panel:#2F3A2F}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 18px 36px;
  background:radial-gradient(120% 80% at 50% 0%,var(--bg2) 0%,var(--bg) 70%);
  color:var(--ink);font-family:"Readex Pro","Segoe UI",Tahoma,sans-serif;line-height:1.7}
main{width:100%;max-width:640px;text-align:center}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);color:var(--ink);display:grid;place-items:center;z-index:5}
.theme svg{width:20px;height:20px}
.moon{width:76px;height:76px;margin:0 auto 12px;display:block;overflow:visible;animation:glow 6s ease-in-out infinite}
.moon .st{animation:tw 3.4s ease-in-out infinite}
.moon .st2{animation-delay:1.3s}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px var(--accent))}50%{filter:drop-shadow(0 0 11px var(--accent))}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes tin{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
.t{animation:tin .45s ease-out}
@media (prefers-reduced-motion: reduce){.moon,.moon .st,.t{animation:none}}
h1{font-family:"Reem Kufi","Readex Pro",serif;font-weight:700;font-size:clamp(32px,8vw,48px);line-height:1.3}
.sub{color:var(--muted);font-weight:300;font-size:15px;margin-top:2px}
.today{color:var(--muted);font-size:13px;font-weight:300;margin-top:6px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 14px;border-radius:99px;font-size:14px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--bg2)}

.pair{display:grid;grid-template-columns:1fr 1fr;margin:30px 0 18px}
.col{padding:0 8px}
.col+.col{border-right:1px solid var(--line)}
.col h2{font-family:"Reem Kufi","Readex Pro",serif;font-weight:500;font-size:20px}
.nums{display:flex;justify-content:center;gap:clamp(14px,5vw,34px);margin:10px 0 8px}
.n{display:block;font-weight:600;font-size:clamp(38px,11vw,62px);line-height:1.15;color:var(--accent);font-variant-numeric:tabular-nums}
.l{display:block;color:var(--muted);font-size:14px;margin-top:-2px}
.dt{color:var(--muted);font-size:12.5px;font-weight:300}
.rmday{display:none;font-family:"Reem Kufi",serif;font-size:clamp(28px,7vw,40px);color:var(--accent);margin:26px 0 16px}

.clock{background:var(--panel);border-radius:28px;padding:22px 16px 18px;margin:0 auto 24px;max-width:460px}
.cap{color:var(--muted);font-size:14px}
.hms{display:flex;justify-content:center;align-items:flex-start;gap:clamp(8px,3vw,18px);direction:ltr;margin-top:6px}
.hms div{min-width:0;text-align:center}
.hms b{display:block;font-weight:600;font-size:clamp(34px,10vw,56px);line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums}
.hms span{display:block;color:var(--muted);font-size:13px}
.hms .c{font-size:clamp(28px,8vw,44px);color:var(--accent);opacity:.7;padding-top:4px}
.tot{margin-top:12px;color:var(--muted);font-size:13.5px;font-weight:300}
.tot strong{color:var(--ink);font-weight:600}

.ift{max-width:460px;margin:-6px auto 24px;color:var(--muted);font-size:14px}
.ift strong{color:var(--accent);font-weight:600}
.nights{max-width:460px;margin:-6px auto 24px;font-size:13px;color:var(--muted)}
.nights p{margin-bottom:6px}
.nights div{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:1px solid var(--line)}
.nights div:last-child{border-bottom:0}
.nights b{font-weight:600;color:var(--ink)}
.nights div.q b,.nights div.q span{color:var(--accent)}
.pray{max-width:460px;margin:0 auto 24px;border-top:1px solid var(--line);padding-top:18px}
.nextp{font-size:15px;margin-bottom:12px}
.nextp strong{color:var(--accent);font-weight:600}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pg div{padding:8px 4px;border-radius:14px}
.pg div.nx{background:var(--panel)}
.pg small{display:block;color:var(--muted);font-size:13px}
.pg b{display:block;font-weight:600;font-size:15px}
.pnote{color:var(--muted);font-size:12px;font-weight:300;margin-top:10px}

.verse{max-width:460px;margin:0 auto 26px}
.verse p{font-family:"Amiri","Readex Pro",serif;font-size:clamp(19px,5vw,24px);line-height:2}
.verse small{color:var(--muted);font-size:13px}
.vh{color:var(--muted);font-size:13px;font-weight:300;margin-bottom:2px}
.verse+.verse{border-top:1px solid var(--line);padding-top:16px}
.vrow{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:4px}
.vbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--accent);display:grid;place-items:center}
.vbtn svg{width:18px;height:18px;transition:transform .6s ease}
.share{border:0;background:var(--accent);color:var(--bg2);padding:10px 26px;border-radius:99px;font-size:15px;font-weight:400}
.done{display:none;font-family:"Reem Kufi",serif;font-size:clamp(34px,9vw,52px);margin:40px 0}

.ov{position:fixed;inset:0;background:rgba(20,24,20,.72);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:9}
.ov.on{display:flex}
.ov img{max-height:68vh;max-width:100%;border-radius:16px}
.ov p{color:#F3ECDF;font-size:14px}
.ov .row{display:flex;gap:10px}
.ov .row button{border:1px solid #F3ECDF;background:transparent;color:#F3ECDF;padding:8px 22px;border-radius:99px;font-size:15px}
</style>
</head>
<body>
<button class="theme" id="theme" aria-label="تبديل الوضع الداكن"></button>
<main>
  <svg class="moon" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M62 14a38 38 0 1 0 24 62A32 32 0 0 1 62 14z" fill="var(--accent)"/>
    <path class="st" d="M78 22l2.4 5.6 5.6 2.4-5.6 2.4L78 38l-2.4-5.6L70 30l5.6-2.4z" fill="var(--accent)"/>
    <circle class="st st2" cx="94" cy="56" r="1.8" fill="var(--accent)"/>
    <circle class="st" cx="92" cy="8" r="1.4" fill="var(--accent)"/>
  </svg>
  <h1 id="title">باقي على رمضان</h1>
  <p class="sub" id="sub"></p>
  <p class="today" id="today"></p>
  <nav class="tabs" id="tabs" aria-label="المناسبات"></nav>

  <div id="live">
    <section class="pair" id="pair" aria-label="العد التنازلي بالشهور والأيام">
      <div class="col">
        <h2>ميلادي</h2>
        <div class="nums">
          <div><span class="n" id="gm">٠</span><span class="l">شهر</span></div>
          <div><span class="n" id="gd">٠</span><span class="l">يوم</span></div>
        </div>
        <p class="dt" id="gdate"></p>
      </div>
      <div class="col">
        <h2>هجري</h2>
        <div class="nums">
          <div><span class="n" id="hm">٠</span><span class="l">شهر</span></div>
          <div><span class="n" id="hd">٠</span><span class="l">يوم</span></div>
        </div>
        <p class="dt" id="hdate"></p>
      </div>
    </section>
    <p class="rmday" id="rmday"></p>

    <section class="clock" id="clock" role="timer" aria-label="الوقت المتبقي بالساعات">
      <p class="cap" id="cap">وقت اليوم المتبقي</p>
      <div class="hms">
        <div><b id="h">٠٠</b><span>ساعة</span></div>
        <div class="c">:</div>
        <div><b id="mi">٠٠</b><span>دقيقة</span></div>
        <div class="c">:</div>
        <div><b id="s">٠٠</b><span>ثانية</span></div>
      </div>
      <p class="tot" id="totp">إجمالي الساعات المتبقية <strong id="tot">٠</strong> ساعة</p>
    </section>
    <p class="ift" id="ift"></p>
  </div>
  <p class="done" id="done"></p>
  <div class="nights" id="nights"></div>

  <section class="pray" aria-label="مواقيت الصلاة">
    <p class="nextp" id="nextp"></p>
    <div class="pg" id="pg"></div>
    <p class="pnote">مواقيت محافظة القاهرة بطريقة الهيئة المصرية العامة للمساحة، وبتتغير تلقائي مع التوقيت الصيفي والشتوي</p>
  </section>

  <section class="verse" aria-label="آية اليوم">
    <div class="vh">آية</div>
    <p id="vt"></p>
    <div class="vrow"><small id="vr"></small><button class="vbtn" id="vnext" aria-label="آية أو دعاء تاني"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button></div>
  </section>

  <section class="verse" aria-label="أذكار">
    <div class="vh">أذكار</div>
    <p id="zt"></p>
    <div class="vrow"><small id="zr"></small><button class="vbtn" id="znext" aria-label="ذكر تاني"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button></div>
  </section>

  <section class="verse" aria-label="أدعية">
    <div class="vh">أدعية</div>
    <p id="dt"></p>
    <div class="vrow"><small id="dr"></small><button class="vbtn" id="dnext" aria-label="دعاء تاني"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button></div>
  </section>

  <button class="share" id="share">شارك الصفحة كصورة</button>
</main>

<div class="ov" id="ov" role="dialog" aria-label="صورة للمشاركة">
  <img id="img" alt="صورة العد التنازلي">
  <p>اضغط مطوّلاً على الصورة لحفظها</p>
  <div class="row"><button id="send">إرسال</button><button id="close">إغلاق</button></div>
</div>

    ["اللَّهُمَّ آتِ نَفْسِي تَقْوَاهَا وَزَكِّهَا أَنْتَ خَيْرُ مَنْ زَكَّاهَا أَنْتَ وَلِيُّهَا وَمَوْلَاهَا","مسلم"],
    ["يَا مُقَلِّبَ الْقُلُوبِ ثَبِّتْ قَلْبِي عَلَى دِينِكَ","الترمذي"],
    ["اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ وَالْعَجْزِ وَالْكَسَلِ وَالْبُخْلِ وَالْجُبْنِ وَضَلَعِ الدَّيْنِ وَغَلَبَةِ الرِّجَالِ","البخاري"]
  ];
  var PN=["الفجر","الشروق","الظهر","العصر","المغرب","العشاء"];
  var $=function(id){return document.getElementById(id);};
  var f=function(n){return n.toLocaleString("ar-EG");};
  var f2=function(n){return (n<10?"٠":"")+n.toLocaleString("ar-EG");};
  function put(id,txt){var e=$(id); if(e.textContent!==txt){e.textContent=txt; e.classList.remove("t"); void e.offsetWidth; e.classList.add("t");}}

  var hfmt=null,gfmt=null,tfmt=null;
  try{
    hfmt=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{year:"numeric",month:"numeric",day:"numeric",timeZone:TZ});
    gfmt=new Intl.DateTimeFormat("en-CA-u-nu-latn",{year:"numeric",month:"numeric",day:"numeric",timeZone:TZ});
    tfmt=new Intl.DateTimeFormat("en-GB-u-nu-latn",{hour:"numeric",minute:"numeric",second:"numeric",hour12:false,timeZone:TZ});
  }catch(e){}
  function parts(fm,d){var o={}; fm.formatToParts(d).forEach(function(p){if(p.type!=="literal"&&p.type!=="era")o[p.type]=parseInt(p.value,10);}); return o;}
  function sod(d){var p=parts(tfmt,d); return (p.hour%24)*3600+p.minute*60+p.second;}
  function addMonths(d,k){var x=new Date(d.getTime()),day=x.getDate(); x.setDate(1); x.setMonth(x.getMonth()+k); var last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate(); x.setDate(Math.min(day,last)); return x;}

  // ---- prayer times: Cairo governorate, Egyptian General Authority of Survey method (Fajr 19.5°, Isha 17.5°) ----
  var R=Math.PI/180;
  function norm(x,m){return ((x%m)+m)%m;}
  function prayers(y,m,d){
    var jd=Date.UTC(y,m-1,d,12)/86400000+2440587.5, n=jd-2451545;
    var L=norm(280.46+0.9856474*n,360), g=norm(357.528+0.9856003*n,360)*R;
    var lam=(L+1.915*Math.sin(g)+0.02*Math.sin(2*g))*R, eps=(23.439-4e-7*n)*R;
    var dec=Math.asin(Math.sin(eps)*Math.sin(lam));
    var ra=norm(Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam))/R/15,24);
    var eqt=norm(L/15-ra+12,24)-12, noon=12-LON/15-eqt, la=LAT*R;
    function ha(alt){var c=(Math.sin(alt*R)-Math.sin(la)*Math.sin(dec))/(Math.cos(la)*Math.cos(dec)); return Math.acos(Math.max(-1,Math.min(1,c)))/R/15;}
    var asrAlt=Math.atan(1/(1+Math.tan(Math.abs(la-dec))))/R;
    var h=[noon-ha(-19.5),noon-ha(-0.833),noon,noon+ha(asrAlt),noon+ha(-0.833),noon+ha(-17.5)];
    return h.map(function(x,i){return new Date((i===2?Math.floor:Math.round)((Date.UTC(y,m-1,d)+x*3600000)/60000)*60000);});
  }
  var TF=new Intl.DateTimeFormat("ar-EG",{hour:"numeric",minute:"2-digit",hour12:true,timeZone:TZ});
  var vi=0,zi=0,di=0,rot=0;
  var pc={key:"",a:null,b:null};
  function dayPrayers(now){
    var g=parts(gfmt,now), key=g.year+"-"+g.month+"-"+g.day;
    if(pc.key!==key){
      pc.key=key; setToday(now); pc.a=prayers(g.year,g.month,g.day); pc.b=prayers(g.year,g.month,g.day+1);
      var tf=new Intl.DateTimeFormat("ar-EG",{hour:"numeric",minute:"2-digit",hour12:true,timeZone:TZ});
      $("pg").innerHTML=pc.a.map(function(t,i){return "<div><small>"+PN[i]+"</small><b>"+tf.format(t)+"</b></div>";}).join("");
      var dn=Math.floor(Date.UTC(g.year,g.month-1,g.day)/86400000);
      vi=dn%VERSES.length; zi=dn%ZIKR.length; di=(dn+3)%DUAS.length;
      $("vt").textContent=VERSES[vi][0]; $("vr").textContent=VERSES[vi][1];
      $("zt").textContent=ZIKR[zi][0]; $("zr").textContent=ZIKR[zi][1];
      $("dt").textContent=DUAS[di][0]; $("dr").textContent=DUAS[di][1];
    }
    return pc;
  }
  function hms(ms){var s=Math.max(0,Math.floor(ms/1000)); return [f2(Math.floor(s/3600)),f2(Math.floor(s%3600/60)),f2(s%60)];}

  // ---- state ----
  var cur=0,T=null,prevLen=30,todT=0,mode="normal";
  function setEvent(i){
    cur=i; var ev=EVENTS[i];
    $("title").textContent=ev.title; $("sub").textContent=ev.sub; $("hdate").textContent=ev.hj;
    document.title=ev.title;
    try{$("gdate").textContent=ev.t.toLocaleDateString("ar-EG",{day:"numeric",month:"long",year:"numeric",timeZone:TZ});}catch(e){}
    if(hfmt){T=parts(hfmt,ev.t); prevLen=parts(hfmt,new Date(ev.t.getTime()-T.day*86400000)).day; todT=sod(ev.t);}
    Array.prototype.forEach.call($("tabs").children,function(b,k){b.className=(k===i)?"on":"";});
    var nb=$("nights");
    if(i===1){
      var b0=EVENTS[0].t.getTime(), df=new Intl.DateTimeFormat("ar-EG",{weekday:"long",day:"numeric",month:"long",timeZone:TZ});
      nb.innerHTML="<p>الليالي الوترية في العشر الأواخر (متوقعة)</p>"+[21,23,25,27,29].map(function(n){return "<div"+(n===27?" class=\"q\"":"")+"><b>ليلة "+f(n)+"</b><span>مساء "+df.format(new Date(b0+(n-2)*86400000))+"</span></div>";}).join("");
    }else nb.innerHTML="";
    tick();
  }
  EVENTS.forEach(function(ev,i){var b=document.createElement("button"); b.textContent=ev.tab; b.onclick=function(){setEvent(i);}; $("tabs").appendChild(b);});
  function setToday(now){
    try{
      var g=now.toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:TZ});
      var h=now.toLocaleDateString("ar-EG-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric",timeZone:TZ});
      $("today").innerHTML="اليوم "+g+" م<br>"+h;
    }catch(e){}
  }

  function tick(){
    var now=new Date(Date.now()+OFF), ev=EVENTS[cur], target=ev.t, p=dayPrayers(now);
    var ram=(cur===0&&now>=target&&now<target.getTime()+30*86400000);
    mode=ram?"ram":(now>=target?"done":"normal");
    $("pair").style.display=(mode==="normal")?"":"none";
    $("rmday").style.display=ram?"block":"none";
    $("clock").style.display=(mode==="done")?"none":"";
    $("totp").style.display=(mode==="normal")?"":"none";
    $("ift").style.display=(mode==="normal")?"":"none";
    $("done").style.display=(mode==="done")?"block":"none";
    if(mode==="done")$("done").textContent=ev.done;

    if(mode==="normal"){
      var m=(target.getFullYear()-now.getFullYear())*12+(target.getMonth()-now.getMonth());
      if(addMonths(now,m)>target)m--; if(m<0)m=0;
      var rest=target-addMonths(now,m), s=Math.floor(rest/1000), d=Math.floor(s/86400); s%=86400;
      var h=Math.floor(s/3600); s%=3600; var mi=Math.floor(s/60); s%=60;
      put("gm",f(m)); put("gd",f(d)); put("h",f2(h)); put("mi",f2(mi)); put("s",f2(s));
      $("tot").textContent=f(Math.floor((target-now)/3600000));
      if(T){
        var H=parts(hfmt,now), hmo=(T.year-H.year)*12+(T.month-H.month), hdy=T.day-H.day-(todT<sod(now)?1:0), gd=0;
        while(hdy<0&&gd++<3){hmo--; hdy+=prevLen;}
        put("hm",f(Math.max(0,hmo))); put("hd",f(Math.max(0,hdy)));
      }
    }else if(ram){
      var n=Math.floor((now-target)/86400000)+1;
      $("rmday").textContent="اليوم "+f(n)+" رمضان";
      var tg,cap;
      if(now<p.a[0]){tg=p.a[0];cap="باقي على أذان الفجر";}
      else if(now<p.a[4]){tg=p.a[4];cap="باقي على الإفطار";}
      else{tg=p.b[0];cap="باقي على أذان الفجر";}
      $("cap").textContent=cap; var x=hms(tg-now); put("h",x[0]); put("mi",x[1]); put("s",x[2]);
    }
    if(mode!=="ram")$("cap").textContent="وقت اليوم المتبقي";

    // next prayer
    var idx=-1,i; for(i=0;i<6;i++){if(p.a[i]>now){idx=i;break;}}
    var nt=(idx<0)?p.b[0]:p.a[idx], nn=PN[idx<0?0:idx], x2=hms(nt-now);
    $("nextp").innerHTML="الجاي: <strong>"+nn+"</strong> بعد "+x2.join(" : ");
    Array.prototype.forEach.call($("pg").children,function(e,k){e.className=(k===(idx<0?0:idx))?"nx":"";});
    if(now<p.a[4])$("ift").innerHTML="أذان المغرب اليوم <strong>"+TF.format(p.a[4])+"</strong> — بعد "+hms(p.a[4]-now).join(" : ");
    else $("ift").innerHTML="أذان المغرب بكرة <strong>"+TF.format(p.b[4])+"</strong>";
  }

  // ---- theme ----
  var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
  var root=document.documentElement;
  function isDark(){var t=root.getAttribute("data-theme"); return t?t==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;}
  function paint(){$("theme").innerHTML=isDark()?SUN:MOON;}
  try{var sv=localStorage.getItem("theme"); if(sv)root.setAttribute("data-theme",sv);}catch(e){}
  $("theme").onclick=function(){var v=isDark()?"light":"dark"; root.setAttribute("data-theme",v); try{localStorage.setItem("theme",v);}catch(e){} paint();};
  paint();
  $("vnext").onclick=function(){
    var k; do{k=Math.floor(Math.random()*VERSES.length);}while(k===vi);
    vi=k; put("vt",VERSES[k][0]); put("vr",VERSES[k][1]);
    rot+=360; $("vnext").firstChild.style.transform="rotate("+rot+"deg)";
  };
  function more(bid,tid,rid,list,getI,setI){
    var r=0;
    $(bid).onclick=function(){
      var k; do{k=Math.floor(Math.random()*list.length);}while(k===getI());
      setI(k); put(tid,list[k][0]); put(rid,list[k][1]);
      r+=360; $(bid).firstChild.style.transform="rotate("+r+"deg)";
    };
  }
  more("znext","zt","zr",ZIKR,function(){return zi;},function(k){zi=k;});
  more("dnext","dt","dr",DUAS,function(){return di;},function(k){di=k;});

  // ---- share as image ----
  function css(n){return getComputedStyle(root).getPropertyValue(n).trim();}
  function makeImage(){
    var W=1080,H=1920,c=document.createElement("canvas"); c.width=W; c.height=H; var x=c.getContext("2d");
    var g=x.createRadialGradient(W/2,0,100,W/2,0,H*0.9); g.addColorStop(0,css("--bg2")); g.addColorStop(1,css("--bg")); x.fillStyle=g; x.fillRect(0,0,W,H);
    x.save(); x.translate(W/2-160,150); x.scale(3.2,3.2); x.fillStyle=css("--accent"); x.fill(new Path2D("M62 14a38 38 0 1 0 24 62A32 32 0 0 1 62 14z")); x.restore();
    x.textAlign="center"; x.direction="rtl";
    function tx(t,y,sz,col,w,fam){x.font=(w||400)+" "+sz+"px "+(fam||"'Readex Pro'")+", Tahoma, sans-serif"; x.fillStyle=col; x.fillText(t,W/2,y);}
    var ev=EVENTS[cur], ink=css("--ink"), acc=css("--accent"), mu=css("--muted");
    tx($("title").textContent,640,96,ink,700,"'Reem Kufi'");
    tx(ev.sub,720,38,mu,300);
    var y=900;
    if(mode==="normal"){
      tx("ميلادي",y,52,ink,500,"'Reem Kufi'"); tx($("gm").textContent+" شهر  و  "+$("gd").textContent+" يوم",y+110,80,acc,600); tx($("gdate").textContent,y+175,34,mu,300);
      y+=330;
      tx("هجري",y,52,ink,500,"'Reem Kufi'"); tx($("hm").textContent+" شهر  و  "+$("hd").textContent+" يوم",y+110,80,acc,600); tx(ev.hj,y+175,34,mu,300);
      y+=330;
    }else if(mode==="ram"){
      tx($("rmday").textContent,y+60,84,acc,600,"'Reem Kufi'"); y+=200; tx($("cap").textContent,y,44,mu,300); y+=40;
    }else{tx(ev.done,y+100,90,acc,700,"'Reem Kufi'"); y+=300;}
    if(mode!=="done"){x.direction="ltr"; tx($("h").textContent+" : "+$("mi").textContent+" : "+$("s").textContent,y+90,120,ink,600); x.direction="rtl"; tx("ساعة : دقيقة : ثانية",y+160,32,mu,300);}
    tx($("vt").textContent,1700,44,ink,400,"'Amiri'"); tx($("vr").textContent,1760,30,mu,300);
    return c;
  }
  $("share").onclick=function(){
    var go=function(){
      var c=makeImage(); $("img").src=c.toDataURL("image/png"); $("ov").className="ov on"; $("img").dataset.ready="1";
    };
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(go); else go();
  };
  $("close").onclick=function(){$("ov").className="ov";};
  $("send").onclick=function(){
    try{
      var c=makeImage();
      c.toBlob(function(b){
        var file=new File([b],"ramadan-countdown.png",{type:"image/png"});
        if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:$("title").textContent}).catch(function(){});
        else if(navigator.share)navigator.share({title:$("title").textContent,text:$("title").textContent}).catch(function(){});
      },"image/png");
    }catch(e){}
  };

  var st=0,nw=Date.now()+OFF;
  if(!(nw>=EVENTS[0].t&&nw<EVENTS[0].t.getTime()+30*86400000)){for(var k=0;k<EVENTS.length;k++){if(EVENTS[k].t>nw){st=k;break;}}}
  setEvent(st); setInterval(tick,1000);
})();
</script>
</body>
</html>
